name: CI

on:
  push:
    branches: [main, "ILL-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-check
      - name: luacheck
        run: luacheck .
      - name: Tests (lua5.1)
        run: lua5.1 tests/run.lua
